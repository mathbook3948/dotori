name: Bug report
description: Something in dotori does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. Follow the [security policy](https://github.com/mathbook3948/dotori/security/policy) instead.
        Remove API keys, tokens, and private messages from logs before you paste them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what dotori did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the chat window.
        2. Ask dotori to ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dotori version
      description: The release, or the commit if you built from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Chat window or settings window
        - Tray
        - Slack, Telegram, or Discord
        - Memory
        - Browser
        - Sub-sessions
        - Routines
        - MCP servers
        - Several PCs
        - Other
  - type: dropdown
    id: model
    attributes:
      label: Model provider
      options:
        - Anthropic
        - OpenAI-compatible
        - Not related
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: What dotori printed to the terminal, if anything.
      render: text
