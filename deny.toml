[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    { name = "cbindgen", allow = ["MPL-2.0"] },
    { name = "dwrote", allow = ["MPL-2.0"] },
    { name = "ksni", allow = ["Unlicense"] },
    { name = "option-ext", allow = ["MPL-2.0"] },
]
