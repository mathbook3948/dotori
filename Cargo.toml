[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.100"
repository = "https://github.com/mathbook3948/dotori"
readme = "README.md"
keywords = ["assistant", "agent", "llm", "memory", "gpui"]
categories = ["gui"]

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[patch.crates-io]
xattr = { path = "vendor/xattr" }
