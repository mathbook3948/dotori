[package]
name = "dotori-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
htmd = "0.6.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2"] }
serde_json = "1"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros", "sync", "process", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
