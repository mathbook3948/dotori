[package]
name = "dotori-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The MCP server of dotori: memory search, web fetch, the browser, and relayed MCP servers"
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
dotori-native = { path = "../native" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
htmd = "0.6.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
lindera = { version = "7.0.0", default-features = false, features = ["mmap"] }
md-5 = "0.11"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.1"
tract-onnx = { version = "0.23.10", default-features = false }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "macros", "sync", "process", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
native-tls = "0.2.18"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }
tokio-native-tls = "0.3.1"

[lints]
workspace = true
