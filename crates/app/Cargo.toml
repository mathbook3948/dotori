[package]
name = "dotori"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A light personal assistant that lives in the tray, with a GPUI chat window and settings window"
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
dotori-connectors = { path = "../connectors" }
dotori-core = { path = "../core" }
dotori-mcp = { path = "../mcp" }
getrandom = "0.4"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "io-std", "io-util", "net", "process"] }
toml = "0.9"
toml_edit = "0.25"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
unicode-segmentation = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jiff = "1.0.2"

[lints]
workspace = true
