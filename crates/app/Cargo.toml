[package]
name = "dotori"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dotori-connectors = { path = "../connectors" }
dotori-core = { path = "../core" }
getrandom = "0.4"
gpui = { version = "0.2.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "io-std", "io-util", "net"] }
toml = "0.9"
unicode-segmentation = { version = "1", optional = true }

[features]
default = ["window"]
window = ["dep:gpui", "dep:unicode-segmentation"]

[lints]
workspace = true
