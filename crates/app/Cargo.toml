[package]
name = "dotori"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A light personal assistant that lives in the tray, with a GPUI chat window and settings window"
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
dotori-connectors = { path = "../connectors" }
dotori-core = { path = "../core" }
dotori-mcp = { path = "../mcp" }
dotori-native = { path = "../native" }
chacha20poly1305 = "0.10.1"
getrandom = "0.4"
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "io-std", "io-util", "net", "process"] }
toml = "0.9"
toml_edit = "0.25"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
unicode-segmentation = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22.1"
jiff = "1.0.2"
sys-locale = "0.3.2"
keyring = "4.2.0"
raw-window-handle = "0.6.2"
resvg = { version = "0.45.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[build-dependencies]
embed-resource = "3.0.12"
resvg = { version = "0.45.1", default-features = false }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
