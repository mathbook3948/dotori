[package]
name = "dotori-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dotori-core = { path = "../core" }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "net", "io-util", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
