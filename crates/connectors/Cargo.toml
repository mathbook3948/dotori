[package]
name = "dotori-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dotori-core = { path = "../core" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
snow = "0.10.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "net", "io-util", "sync", "macros", "process"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
uuid = { version = "1.29.3", features = ["v7"] }

[dev-dependencies]
dotori-mcp = { path = "../mcp" }
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
