[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy" }
ast-grep = "0.51.3"
cargo-deny = "0.22.0"

[hooks]
postinstall = "git config core.hooksPath .githooks"

[tasks.check]
description = "Format, lint, test, and guard checks"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "ast-grep scan --no-ignore hidden",
  "cargo run --quiet --package xtask -- forbidden-chars",
  "cargo run --quiet --package xtask -- core-deps",
  "cargo run --quiet --package xtask -- root-entries",
  "cargo run --quiet --package xtask -- docs",
  "cargo run --quiet --package xtask -- hooks",
  "cargo run --quiet --package xtask -- sql-schema",
  "cargo run --quiet --package xtask -- design-tokens",
  "cargo deny check licenses",
]

[tasks.docs]
description = "Regenerate the docs index"
run = "cargo run --quiet --package xtask -- docs-write"

[tasks.design]
description = "Write the window themes from DESIGN.md"
run = "cargo run --quiet --package xtask -- design-write"
